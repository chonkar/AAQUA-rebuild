# AAQUA tenant compose — only the app backend. Postgres, Keycloak,
# and the public-facing nginx live in /opt/shared-infra. This file joins
# the shared docker network as `external: true`.
#
# Bring up:    docker compose up -d --build
# Update:      git pull && ./scripts/publish-spa.sh && docker compose up -d --build app

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /aaqua/
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://8.231.124.161/auth}
        VITE_KEYCLOAK_REALM: aaseya-platform
        VITE_KEYCLOAK_CLIENT_ID: aaqua-frontend
    container_name: aaqua-app
    init: true                # tini-equivalent signal forwarding (replaces in-image tini)
    environment:
      NODE_ENV: production
      PORT: 3001
      DISPLAY: ":99"
      DB_HOST: shared-postgres
      DB_PORT: 5432
      DB_USER: aaqua_app
      DB_NAME: aaqua_security
      DB_LOGGING: "false"
      VITE_LLM_ENDPOINT: https://llm.lab.aaseya.com/v1
      VITE_LLM_MODEL: gemma-4
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL:-https://8.231.124.161/auth/realms/aaseya-platform}
      # Backend JWKS fetch URL. Defaults to the docker-internal Keycloak so the self-signed
      # TLS cert on the public IP doesn't need to be trusted by the backend container.
      # The issuer (REALM_URL) MUST remain the public URL — that's what's baked into token
      # `iss` claims and what the SPA verifies against.
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://shared-keycloak:8080/auth/realms/aaseya-platform/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: aaqua-frontend
      JIRA_ENABLED: "false"
    secrets:
      - llm_api_key
      - db_password
      - jira_token
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/runtime-info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - shared-infra_default

networks:
  shared-infra_default:
    external: true

secrets:
  llm_api_key:
    file: /opt/shared-infra/secrets/aaqua/llm_api_key.txt
  db_password:
    file: /opt/shared-infra/secrets/aaqua/db_password.txt
  jira_token:
    # Per CLAUDE.md gotcha #8: AAQUA secrets live ONLY at /opt/shared-infra/secrets/aaqua/.
    # Was previously a relative ./secrets/jira_token.txt path — the inconsistency caused
    # CI deploys to fail with "bind source path does not exist" when the per-repo secrets/
    # directory wasn't manually created on the VM.
    file: /opt/shared-infra/secrets/aaqua/jira_token.txt
